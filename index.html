<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Club — Расписание игр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f0f4f9;--bg2:#e6edf5;--card:#fff;--text:#111827;--txt2:#4b5563;--muted:#9ca3af;
  --border:#e5e9ef;--bord2:#d1d8e0;
  --blue:#1d6eea;--bdk:#1558c8;--blt:#3b82f6;--bpale:#eff6ff;
  --green:#15803d;--red:#dc2626;--gold:#f59e0b;
  --sh0:0 0 0 1px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.06);
  --sh1:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
  --sh2:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

## /* NAV */
.nav{background:var(--bg);border-bottom:1px solid var(--border)}
.navi{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
.burger{display:flex;flex-direction:column;gap:4.5px;padding:6px;flex-shrink:0}
.burger span{width:22px;height:2px;background:#94a3b8;border-radius:2px;transition:background .2s}
.burger:hover span{background:var(--text)}
.navlinks{display:flex;gap:32px;font-size:16px}
.navlinks a{color:var(--txt2);padding:2px 0;transition:color .15s;white-space:nowrap;cursor:pointer}
.navlinks a:hover{color:var(--text)}
.navlinks a.active{color:var(--text);font-weight:500}
.navlinks a.dis{color:var(--muted);cursor:not-allowed;pointer-events:none}
.nsp{flex:1}
.navava{width:42px;height:42px;border-radius:50%;overflow:hidden;cursor:pointer;border:2px solid var(--border);transition:border-color .15s,transform .15s;flex-shrink:0;background:var(--bg2)}
.navava:hover{border-color:var(--blue);transform:scale(1.04)}
.navava img,.navava svg{width:100%;height:100%;object-fit:cover;display:block}

## /* CALENDAR */
.cal-section{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg)}
.dates-bar{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:10px}
.darrow{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;flex-shrink:0;transition:background .15s,color .15s}
.darrow:hover{background:var(--card);color:var(--text);box-shadow:var(--sh0)}
.dscroll{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex:1;min-width:0}
@media(max-width:700px){.dscroll{display:flex;overflow-x:auto;scrollbar-width:none}.dscroll::-webkit-scrollbar{display:none}}
.dpill{padding:10px 14px;border:1px solid var(--bord2);border-radius:999px;background:var(--card);font-size:13.5px;color:var(--txt2);white-space:nowrap;text-align:center;transition:all .18s;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dpill:hover{border-color:var(--blt);color:var(--text)}
.dpill.today{border-color:var(--blue);color:var(--blue);font-weight:600}
.dpill.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;box-shadow:0 4px 12px rgba(29,110,234,.3)}
.dpill.today.active{background:var(--bdk);border-color:var(--bdk)}

## /* TAGS */
.tag-section{border-bottom:1px solid var(--border);background:var(--bg)}
.tags-bar{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tags-bar::-webkit-scrollbar{display:none}
.tpill{padding:7px 16px;border:1px solid var(--bord2);border-radius:8px;background:#f8fafc;font-size:13px;color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:inherit}
.tpill:hover{border-color:var(--blt);color:var(--blue);background:var(--bpale)}
.tpill.active{background:var(--card);color:var(--text);border-color:var(--bord2);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.05)}

## /* TIME */
.tlabel{max-width:1200px;margin:0 auto;padding:28px 24px 14px;font-size:20px;font-weight:300;letter-spacing:-.02em;color:var(--text)}

## /* GRID */
.games-row{max-width:1200px;margin:0 auto 16px;padding:0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:960px){.games-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.games-row{grid-template-columns:1fr;padding:0 16px}}

## /* CARDS */
.card-hero,.card-simple,.card-large{background:var(--card);border-radius:14px;box-shadow:var(--sh0);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;border:1px solid rgba(0,0,0,.04)}
.card-hero:hover,.card-simple:hover,.card-large:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.card-hero{overflow:hidden;display:flex;min-height:210px}
.card-hero .cover{width:44%;flex-shrink:0;background-size:cover;background-position:center;position:relative;background-color:#1a1410}
.cov-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65) 0%,transparent 50%)}
.cov-title{position:absolute;bottom:14px;left:14px;right:14px;color:white}
.cov-title h3{font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.02em;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.cov-title p{font-size:10px;margin-top:4px;opacity:.9;line-height:1.3}
.card-hero .cinfo{flex:1;padding:16px;display:flex;flex-direction:column;min-width:0}
.card-simple{padding:16px;display:flex;flex-direction:column;min-height:210px}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-size:15px;font-weight:500;line-height:1.3}
.ctime{font-size:12.5px;color:var(--txt2);margin-top:3px}
.cprice{font-size:15px;font-weight:700;color:var(--green);white-space:nowrap;flex-shrink:0}
.cloc{font-size:10.5px;color:var(--blt);margin-top:5px;line-height:1.35}
.chost{display:flex;align-items:center;gap:9px;margin-top:14px}
.hmini{width:32px;height:32px;border-radius:50%;background:#d4a574;flex-shrink:0;overflow:hidden}
.hmini svg,.hmini img{width:100%;height:100%;display:block;object-fit:cover}
.hname{font-size:14px;font-weight:600;line-height:1.2}
.hrole{font-size:11px;color:var(--muted);margin-top:1px}
.cglabel{font-size:11px;color:var(--muted);margin-top:14px;margin-bottom:7px}
.avas{display:flex;flex-wrap:wrap;gap:4px}
.av{width:22px;height:22px;border-radius:50%;background:#d4a574;overflow:hidden;flex-shrink:0}
.av.e{background:#e5e7eb}
.av svg{width:100%;height:100%}
.cbot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:14px}
.mlabel{font-size:11px;color:var(--muted)}
.plus{width:46px;height:46px;border-radius:50%;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;box-shadow:0 4px 12px rgba(29,110,234,.35);transition:all .15s}
.plus:hover{background:var(--bdk);transform:scale(1.06);box-shadow:0 6px 16px rgba(29,110,234,.4)}

## /* LARGE */
.lwrap{max-width:1200px;margin:0 auto 16px;padding:0 24px}
.card-large{overflow:hidden;display:flex;max-width:740px;margin:0 auto}
.card-large .cover{width:230px;flex-shrink:0;background-size:cover;background-position:center;position:relative;min-height:340px;background-color:#1a1410}
.card-large .cov-title h3{font-size:26px}
.card-large .linfo{flex:1;padding:20px 22px;display:flex;flex-direction:column}
.card-large .cname{font-size:16px}
.hblock{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.btop{position:absolute;top:10px;left:10px;width:56px;height:56px;border-radius:50%;background:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1a1a1a;font-weight:800;font-size:9.5px;line-height:1.1;border:3px solid white;box-shadow:var(--sh1)}
.clikes{position:absolute;top:10px;right:12px;display:flex;align-items:center;gap:4px;color:white;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.clikes svg{width:20px;height:20px}
@media(max-width:700px){.card-large{flex-direction:column}.card-large .cover{width:100%;min-height:220px}}

## /* ABOUT */
.about-sec{background:var(--bg2);padding:48px 24px;margin-top:48px;border-top:1px solid var(--border)}
.abi{max-width:1200px;margin:0 auto}
.stitle{font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--text);margin-bottom:22px}
.about-card{background:var(--card);border-radius:20px;padding:24px;display:grid;grid-template-columns:260px 1fr;gap:28px;box-shadow:var(--sh0);margin-bottom:36px;border:1px solid rgba(0,0,0,.04)}
.alogo{background:linear-gradient(135deg,#0f172a,#1e1b4b);border-radius:14px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.alogo svg{width:80%;height:auto}
.ainfo{display:flex;flex-direction:column}
.founder-row{display:flex;gap:14px;margin-bottom:16px}
.fphoto{width:60px;height:60px;border-radius:50%;background:#d4a574;overflow:hidden;flex-shrink:0}
.fphoto svg,.fphoto img{width:100%;height:100%;object-fit:cover}
.fname{font-size:16px;font-weight:700}
.frole{font-size:12.5px;color:var(--muted);margin-top:2px}
.ainfo p{font-size:13.5px;color:var(--txt2);line-height:1.7;margin-bottom:14px}
.motto{font-style:italic;color:var(--text);font-weight:500}
.trow{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0 18px}
.tmember{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:78px}
.tphoto{width:58px;height:58px;border-radius:50%;overflow:hidden;background:#d4a574}
.tphoto svg,.tphoto img{width:100%;height:100%;object-fit:cover}
.tname{font-size:13px;font-weight:600}
.trole{font-size:10.5px;color:var(--muted)}
@media(max-width:720px){.about-card{grid-template-columns:1fr}.alogo{max-width:220px;margin:0 auto}}

## /* HOSTS */
.hgrid{display:flex;gap:20px;flex-wrap:wrap}
.hcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:88px}
.hphoto{width:80px;height:80px;border-radius:50%;overflow:hidden;background:#d4a574;box-shadow:var(--sh1)}
.hphoto svg,.hphoto img{width:100%;height:100%;object-fit:cover}
.hn{font-size:13.5px;font-weight:600}
.hr{font-size:11px;color:var(--muted)}
.order-btn{display:block;width:100%;max-width:700px;margin:32px auto 0;padding:18px;background:var(--blue);color:white;border-radius:999px;font-size:17px;font-weight:500;text-align:center;font-family:inherit;transition:background .15s;box-shadow:0 4px 14px rgba(29,110,234,.3)}
.order-btn:hover{background:var(--bdk)}

## /* REVIEWS */
.rcard{background:var(--card);border-radius:14px;padding:16px 20px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:12px;display:flex;gap:14px;border:1px solid rgba(0,0,0,.04)}
.rphoto{width:46px;height:46px;border-radius:50%;background:#d4a574;overflow:hidden;flex-shrink:0}
.rphoto svg{width:100%;height:100%}
.rname{font-size:14px;font-weight:600}
.rrole{font-size:11px;color:var(--muted);margin-bottom:5px}
.rtext{font-size:13.5px;color:var(--txt2);line-height:1.5}

## /* FOOTER */
footer{padding:32px 24px;text-align:center;color:var(--muted);font-size:12px;background:var(--card);border-top:1px solid var(--border)}
footer .brand{font-weight:600;color:var(--txt2);font-size:14px;margin-bottom:6px}

# /* EMPTY / LOADING */
.empty{padding:64px 24px;text-align:center;color:var(--muted)}
.empty .em{font-size:40px;margin-bottom:14px}
.empty h3{font-size:16px;font-weight:500;color:var(--txt2);margin-bottom:6px}
.lwrap2{padding:60px;text-align:center}
.spin{display:inline-block;width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

## /* ALL VIEWS */
.profile-view,.game-detail-view,.admin-view{display:none}

## /* PROFILE */
.profile-view{padding:0 24px 48px;max-width:1100px;margin:0 auto}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-size:14px;padding:18px 0;cursor:pointer}
.back-link:hover{color:var(--bdk)}
.pgrid{display:grid;grid-template-columns:180px 1fr 200px;gap:32px;align-items:start}
.pbadge-block{display:flex;flex-direction:column;align-items:center;gap:6px}
.pbadge-lbl{font-size:14px;font-weight:500}
.pname-block{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.pname-block h1{font-size:28px;font-weight:700;cursor:pointer;transition:color .15s}
.pname-block h1:hover{color:var(--blue)}
.pftitle{font-size:16px;color:var(--txt2);cursor:pointer}
.pftitle:hover{color:var(--blue)}
.pfstar{display:inline-block;background:#dc2626;color:white;font-size:11px;font-weight:600;padding:4px 14px;border-radius:4px;cursor:pointer;margin-top:4px}
.pcenter{display:flex;flex-direction:column;align-items:center;gap:24px}
.pava-big{width:280px;height:280px;border-radius:50%;border:4px solid #84cc16;background:#1a1a2e;position:relative;cursor:pointer;background-size:cover;background-position:center;overflow:hidden}
.up-hint{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:white;font-size:14px;opacity:0;transition:opacity .2s;border-radius:50%}
.pava-big:hover .up-hint{opacity:1}
.pava-big input{display:none}
.pmedals{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.mitem{display:flex;flex-direction:column;align-items:center;gap:6px;width:100px;text-align:center}
.micon{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh1)}
.mgold{background:linear-gradient(135deg,#fbbf24,#b45309)}
.mgreen{background:linear-gradient(135deg,#84cc16,#3f6212)}
.mpink{background:linear-gradient(135deg,#f9a8d4,#be185d)}
.micon svg{width:28px;height:28px;color:white}
.mlbl{font-size:10.5px;color:var(--txt2);line-height:1.3}
.pright{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.pbtn{padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;color:white;font-family:inherit;cursor:pointer;transition:opacity .15s,transform .15s}
.pbtn:hover{opacity:.9;transform:translateY(-1px)}
.pbtn.green{background:#16a34a}
.pbtn.blue{background:var(--blue)}
.stats-wrap{border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:28px 0;margin-top:32px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);max-width:780px;margin:0 auto}
.scol{text-align:center;padding:0 20px}
.scol+.scol{border-left:1px solid var(--border)}
.styp{font-size:12.5px;color:var(--txt2);margin-bottom:12px}
.snums{display:flex;justify-content:center;gap:22px}
.sblock{display:flex;flex-direction:column;align-items:center}
.snum{font-size:26px;font-weight:700;line-height:1}
.slbl{font-size:10.5px;color:var(--muted);margin-top:4px}
@media(max-width:860px){.pgrid{grid-template-columns:1fr;text-align:center}.pname-block,.pbadge-block,.pright{align-items:center}.pava-big{width:220px;height:220px}.stats-grid{grid-template-columns:1fr}.scol+.scol{border-left:none;border-top:1px solid var(--border);padding-top:20px;margin-top:20px}}

## /* GAME DETAIL */
.game-detail-view{padding:0 24px 48px;max-width:820px;margin:0 auto}
.gd-cover{height:260px;border-radius:20px;background-size:cover;background-position:center;background-color:#1a1410;margin-bottom:20px;box-shadow:var(--sh1)}
.gd-card{background:var(--card);border-radius:14px;padding:22px;box-shadow:var(--sh0);margin-bottom:20px}
.gd-title{font-size:22px;font-weight:700;margin-bottom:10px}
.gd-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gd-time{font-size:15px;color:var(--txt2)}
.gd-price{font-size:20px;font-weight:700;color:var(--green)}
.gd-loc{font-size:12.5px;color:var(--blt);margin-bottom:16px}
.gd-hosts{display:flex;gap:16px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--border)}
.gd-host{display:flex;gap:12px;align-items:center}
.gd-hphoto{width:52px;height:52px;border-radius:50%;overflow:hidden;background:#d4a574}
.gd-hphoto svg,.gd-hphoto img{width:100%;height:100%;object-fit:cover}
.gd-hname{font-size:15px;font-weight:600}
.gd-hrole{font-size:12px;color:var(--muted);margin-top:2px}
.gd-players{background:var(--card);border-radius:14px;padding:22px;box-shadow:var(--sh0)}
.gd-players h3{font-size:17px;font-weight:600;margin-bottom:16px}
.prow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prphoto{width:46px;height:46px;border-radius:50%;background:#d4a574;overflow:hidden;flex-shrink:0;position:relative}
.prphoto svg{width:100%;height:100%}
.prinfo{flex:1}
.prname{font-size:14.5px;font-weight:600}
.prtitle{font-size:12px;color:var(--muted);margin-top:2px}
.pbadge{position:absolute;bottom:-2px;right:-2px;font-size:8px;font-weight:700;padding:2px 5px;border-radius:4px;color:white}
.pbadge.vet{background:var(--blue)}
.pbadge.star{background:#dc2626}
.pbadge.new{background:#9ca3af}
.pbadge.master{background:#f59e0b}

## /* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-bg.open{display:flex}
.modal{background:white;border-radius:20px;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:28px 24px;text-align:center;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.mcls{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
.mcls:hover{color:var(--text);background:var(--bg)}
.modal h2{color:var(--blue);font-size:17px;font-weight:700;margin-bottom:5px}
.modal h3{font-size:22px;font-weight:700}
.mmeta{font-size:13px;color:var(--txt2);margin:4px 0 18px}
.mtabs{display:flex;gap:4px;background:#f1f5f9;border-radius:999px;padding:3px;margin-bottom:16px}
.mtabs button{flex:1;padding:8px;border-radius:999px;font-size:12px;color:var(--txt2);font-family:inherit;font-weight:500}
.mtabs button.active{background:var(--blue);color:white}
.minputs{display:flex;gap:8px;margin-bottom:18px}
.minputs input{flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;background:#fafafa}
.minputs input:focus{outline:none;border-color:var(--blue);background:white}
.twrap{position:relative;width:270px;height:270px;margin:0 auto 18px}
.tcenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13.5px;color:var(--txt2);text-align:center;line-height:1.4;pointer-events:none}
.seat{position:absolute;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;cursor:pointer;background:white;border:1.5px solid var(--bord2);color:var(--txt2);transition:all .15s}
.seat:hover:not(.taken){border-color:var(--blue);color:var(--blue);transform:scale(1.1)}
.seat.taken{background:#fee2e2;border-color:#fca5a5;color:#dc2626;cursor:not-allowed}
.seat.selected{background:#22c55e;border-color:#16a34a;color:white;transform:scale(1.1);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.ckrow{display:flex;align-items:center;justify-content:center;gap:18px;font-size:13px;color:var(--txt2);margin-bottom:14px}
.ckrow label{display:flex;align-items:center;gap:6px;cursor:pointer}
.ckrow input[type=text]{width:108px;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px}
.btn-p{width:100%;padding:14px;background:var(--blue);color:white;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;margin-bottom:8px;transition:background .15s}
.btn-p:hover{background:var(--bdk)}
.btn-p:disabled{opacity:.45;cursor:not-allowed}
.btn-s{width:100%;padding:14px;background:white;color:var(--blue);border:1.5px solid var(--blue);border-radius:8px;font-size:14px;font-weight:500;font-family:inherit}
.btn-s:hover{background:var(--bpale)}
.legal{font-size:10.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.legal a{color:var(--blue)}

## /* DRAWER */
.dbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:90}
.dbg.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:85vw;background:white;z-index:91;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.12)}
.drawer.open{transform:translateX(0)}
.dhead{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.dttl{font-size:17px;font-weight:700}
.dx{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
.dx:hover{background:var(--bg);color:var(--text)}
.duser{padding:16px 22px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border)}
.dava{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--bg2);flex-shrink:0}
.dava svg,.dava img{width:100%;height:100%;object-fit:cover}
.duname{font-size:14px;font-weight:600}
.dusub{font-size:12px;color:var(--muted)}
.dnav{flex:1;overflow-y:auto;padding:8px 0}
.dsec{padding:12px 22px 4px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dnav a{display:flex;align-items:center;gap:12px;padding:11px 22px;font-size:14.5px;color:var(--text);transition:background .12s;cursor:pointer}
.dnav a:hover{background:var(--bg)}
.dnav a.dis{color:var(--muted);cursor:not-allowed}
.dnav a.dis:hover{background:transparent}
.dic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.dnav a.dis .dic{color:#d1d5db}
.dfoot{padding:16px 22px;border-top:1px solid var(--border)}
.loginbtn{width:100%;padding:12px;background:var(--blue);color:white;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit}
.loginbtn:hover{background:var(--bdk)}

## /* ADMIN */
.admin-view{padding:28px 24px 48px;max-width:1200px;margin:0 auto}
.ahead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--border)}
.ahead h1{font-size:26px;font-weight:700}
.aexit{padding:10px 18px;background:var(--red);color:white;border-radius:8px;font-size:14px;font-weight:500}
